name: Validate
"on": [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/*.txt
      - name: Check source, inputs, corpus and published results
        run: |
          python -m pip install -r requirements/control.txt
          python -m scripts.check_source
          PYTHONPATH=. python -m unittest discover -s tests -v
      - name: Validate Kubernetes YAML
        run: docker run --rm -v "$PWD:/work:ro" ghcr.io/yannh/kubeconform:v0.8.0 -strict -summary /work/k8s.yaml
